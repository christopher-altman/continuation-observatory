<div class="observatory-boot" data-observatory-boot aria-hidden="true">
  <div class="observatory-boot-scrim"></div>
  <div class="observatory-boot-panel">
    <div class="summary-label">Instrument Boot</div>
    <div class="observatory-boot-visual">
      <div class="observatory-boot-lottie" data-observatory-boot-lottie aria-hidden="true"></div>
      <div class="observatory-boot-fallback" data-observatory-boot-fallback aria-hidden="true">
        <span class="observatory-boot-fallback-ring observatory-boot-fallback-ring--outer"></span>
        <span class="observatory-boot-fallback-ring observatory-boot-fallback-ring--mid"></span>
        <span class="observatory-boot-fallback-ring observatory-boot-fallback-ring--inner"></span>
      </div>
    </div>
    <div class="observatory-boot-copy">
      <h2>Continuation Observatory</h2>
      <p>Wake sequence. Calibration. Lock acquisition. Live handoff.</p>
    </div>
    <div class="observatory-boot-readout" aria-live="polite">
      <div class="observatory-boot-line is-active" data-boot-line="wake">
        <span>Wake Sequence</span>
        <span>Core bus online</span>
      </div>
      <div class="observatory-boot-line" data-boot-line="calibration">
        <span>Calibration</span>
        <span>Optics and threshold aligned</span>
      </div>
      <div class="observatory-boot-line" data-boot-line="acquisition">
        <span>Target Acquisition</span>
        <span>Signal lattice resolving</span>
      </div>
      <div class="observatory-boot-line" data-boot-line="handoff">
        <span>Live Handoff</span>
        <span>Instrument surface unlocked</span>
      </div>
    </div>
  </div>
</div>
